# Cloud Monitoring alert: travian-tools-db disk bytes_used > 21 GiB (5-minute mean).
# Created with:
#   gcloud alpha monitoring policies create --project artogo-travian-tools \
#     --policy-from-file deploy/monitoring/cloudsql-disk-bytes-21gib.yaml \
#     --notification-channels <email channel name>
# See docs/deploy-cloud-run.md 「Cloud SQL 硬碟：auto-increase＋兩條警報」.
displayName: "travian-tools-db disk bytes_used > 21 GiB"
combiner: OR
conditions:
  - displayName: "Cloud SQL travian-tools-db disk bytes_used > 21 GiB (22548578304 bytes)"
    conditionThreshold:
      filter: >-
        resource.type = "cloudsql_database"
        AND resource.labels.database_id = "artogo-travian-tools:travian-tools-db"
        AND metric.type = "cloudsql.googleapis.com/database/disk/bytes_used"
      comparison: COMPARISON_GT
      # 21 GiB = 21 * 1024^3 bytes (70% of the 30 GB auto-increase cap).
      thresholdValue: 22548578304
      duration: 300s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_MEAN
      trigger:
        count: 1
alertStrategy:
  autoClose: 604800s
documentation:
  mimeType: text/markdown
  content: |-
    travian-tools-db (Cloud SQL, artogo-travian-tools) disk holds more than 21 GiB (70% of the 30 GB auto-increase cap).
    map.sql snapshots are kept in full (no automatic deletion), so they are the
    main growth. Storage auto-increase is on with a 30 GB cap; at the cap writes
    fail when the disk fills. See docs/deploy-cloud-run.md.
