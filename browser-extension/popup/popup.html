<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travian Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Travian Tools</h1>
    </header>

    <!-- 未登入狀態 -->
    <div id="login-section" class="section">
      <h2>登入</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">電子郵件</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">密碼</label>
          <input type="password" id="password" placeholder="密碼" required>
        </div>
        <button type="submit" class="btn btn-primary">登入</button>
      </form>
      <p class="hint">
        還沒有帳號？<a href="http://localhost:3000/register" target="_blank">立即註冊</a>
      </p>
    </div>

    <!-- 已登入狀態 -->
    <div id="main-section" class="section hidden">
      <div class="user-info">
        <span id="username"></span>
        <button id="logout-btn" class="btn btn-small">登出</button>
      </div>

      <div class="accounts-section">
        <h3>選擇遊戲帳號</h3>
        <select id="account-select">
          <option value="">-- 選擇帳號 --</option>
        </select>
      </div>

      <div class="status-section">
        <h3>頁面狀態</h3>
        <div id="page-status" class="status-box">
          <span class="status-label">當前頁面:</span>
          <span id="page-type" class="status-value">檢測中...</span>
        </div>
      </div>

      <div class="actions-section">
        <button id="sync-btn" class="btn btn-primary" disabled>同步當前頁面</button>
        <p id="sync-result" class="sync-result"></p>
      </div>
    </div>

    <!-- 錯誤訊息 -->
    <div id="error-message" class="error-message hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
