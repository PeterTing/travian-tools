<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travian Tools</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 這個 popup 刻意不放任何輸入框：不輸入密碼，也絕對不問遊戲密碼。 -->
  <main class="ext">
    <header class="ext-head">
      <b>Travian Tools</b>
      <button id="logout-btn" type="button" class="link hidden">登出擴充</button>
    </header>

    <!-- 未登入：只有一顆按鈕，開新分頁到工具網站登入 -->
    <section id="login-section" class="hidden">
      <p class="small">還沒登入這個工具</p>
      <button id="open-site-btn" type="button" class="btn p">在工具網站登入</button>
      <p class="small note">會開新分頁到工具網站登入，登完回來就能用。這裡不輸入任何密碼，也絕對不問遊戲密碼。</p>
    </section>

    <!-- 已登入 -->
    <section id="main-section" class="hidden">
      <p class="small">目前頁面：<span id="page-type">檢測中…</span></p>
      <button id="sync-btn" type="button" class="btn p" disabled>上傳這一頁</button>
      <p class="small note target">
        <label for="account-select">存到</label>
        <select id="account-select">
          <option value="">選擇遊戲帳號</option>
        </select>
      </p>
      <p class="small">不會自動上傳其他頁面。</p>
      <p id="sync-result" class="sync-result" role="status"></p>
      <p class="small meta"><span id="username"></span><span id="expiry"></span></p>
    </section>

    <p id="error-message" class="error-message hidden" role="alert"></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
