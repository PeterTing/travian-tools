name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend CI
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql+mysqlconnector://root:test_password@127.0.0.1:3306/travian_tools_test
      # Test-only value: Settings refuse the public default when DEBUG is off.
      JWT_SECRET_KEY: ci-test-only-jwt-secret-not-for-production-0123456789
      # 測試帳號名、村莊名清單（一行一個），去識別測試用；沒設時 tests/unit/test_game_data_generated.py 在 CI 會失敗
      TT_ID_DENYLIST: ${{ secrets.TT_ID_DENYLIST }}
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: travian_tools_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Compliance guard (no browser automation / Travian traffic except map.sql)
        run: |
          pytest tests/unit/test_compliance.py --no-cov -q

      - name: Migrations build the exact model schema
        env:
          DATABASE_URL: mysql+mysqlconnector://root:test_password@localhost:3306/travian_tools_test
        run: |
          alembic upgrade head
          alembic check

      - name: Latest migration round trip (downgrade one step, upgrade again)
        env:
          DATABASE_URL: mysql+mysqlconnector://root:test_password@localhost:3306/travian_tools_test
        run: |
          alembic downgrade -1
          alembic upgrade head
          alembic check

      - name: Migration 0009 data conversion on MySQL (upgrade -> downgrade -> upgrade)
        env:
          MIGRATION_TEST_MYSQL_URL: mysql+mysqlconnector://root:test_password@localhost:3306/travian_tools_migration_test
        run: |
          python -c "import mysql.connector as m; c = m.connect(host='127.0.0.1', port=3306, user='root', password='test_password'); c.cursor().execute('CREATE DATABASE IF NOT EXISTS travian_tools_migration_test')"
          pytest tests/unit/test_migration_0009_multi_tribe.py --no-cov -q

      - name: Type check with mypy
        run: |
          mypy app --ignore-missing-imports

      - name: Run tests
        env:
          DATABASE_URL: mysql+mysqlconnector://root:test_password@localhost:3306/travian_tools_test
        run: |
          pytest --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        # Optional reporting: v3 uploader is deprecated and fails TLS; never
        # let a coverage upload outage fail the build.
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          fail_ci_if_error: false
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # Frontend CI
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd ..
          pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # OCR service (P0-07): RapidOCR on our own Cloud Run (tt-ocr); no outbound network
  ocr:
    name: OCR service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ocr/requirements.txt
            ocr/requirements-dev.txt

      - name: Install dependencies (pinned, headless OpenCV)
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests (API + real engine on rendered text)
        run: |
          python -m pytest -q

  # Browser extension (no dependencies; Node's built-in test runner)
  extension:
    name: Extension CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          for f in background/background.js popup/popup.js lib/*.js content/content.js; do
            node --check "$f"
          done

      - name: Run tests (credential expiry / clear, popup has no inputs)
        run: node --test tests/

  # Docker Build Test
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend, frontend, ocr]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: travian-tools-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: travian-tools-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build OCR Image
        uses: docker/build-push-action@v5
        with:
          context: ./ocr
          push: false
          tags: travian-tools-ocr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
