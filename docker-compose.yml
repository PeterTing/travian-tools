services:
  # Redis for ARQ task queue
  redis:
    image: redis:7-alpine
    container_name: travian-tools-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
    networks:
      - travian-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: travian-tools-db
    restart: unless-stopped
    env_file:
      - ./docker/.env.db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - travian-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travian-tools-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - CHROME_HEADLESS=true
      - DISPLAY=:99
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - travian_chrome_profile:/root/.travian_chrome_profile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /docker-entrypoint.sh
    networks:
      - travian-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # React Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: travian-tools-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "pnpm install && pnpm dev --host --port 5174"
    networks:
      - travian-network

volumes:
  mysql_data:
  redis_data:
  frontend_node_modules:
  travian_chrome_profile:

networks:
  travian-network:
    driver: bridge
